<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KALBLAST — Board (A4 split)</title>
<!-- Print-only harness: crops the already-authoritative board PNG
     (print-assets/kalblast_perfected_board_<lang>.png) into two overlapping
     A4-sized halves. Deliberately does NOT re-render board.html — that PNG
     is the single verified source of truth (see build-board-pngs.js), so
     this only crops pixels, never regenerates them. See
     build-board-a4-pdf.js for how the two languages get captured. -->
<style>
  @page { size: A4; margin: 10mm; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #ffffff; }

  /* Board size/overlap/half-width are set from board-print-constants.js at
     runtime (see the script at the bottom), not hardcoded here, so this
     file can't silently drift from print-sheet.html's ability templates. */
  .half {
    overflow: hidden;
    position: relative;
    page-break-after: always;
  }
  .half:last-child { page-break-after: auto; }
  .half img {
    position: absolute;
    top: 0;
  }

  /* Plain alignment ticks at the seam edge, no text, for rough pre-alignment
     before fine-tuning against the overlapping artwork itself. */
  .tick {
    position: absolute;
    width: 6mm;
    height: 0.4mm;
    background: #999;
  }
  .half.left .tick { right: 0; }
  .half.right .tick { left: 0; }
</style>
</head>
<body>
  <div class="half left">
    <img id="board-img-left" src="print-assets/kalblast_perfected_board_en.png" alt="">
    <div class="tick"></div>
    <div class="tick"></div>
    <div class="tick"></div>
  </div>
  <div class="half right">
    <img id="board-img-right" src="print-assets/kalblast_perfected_board_en.png" alt="">
    <div class="tick"></div>
    <div class="tick"></div>
    <div class="tick"></div>
  </div>

  <script src="board-print-constants.js"></script>
  <script>
    // Derive every physical dimension from the shared constants instead of
    // hardcoding them a second time here (see board-print-constants.js).
    const halfWidthMm = BOARD_PRINT_MM / 2 + OVERLAP_MM;
    const rightShiftMm = -(BOARD_PRINT_MM / 2 - OVERLAP_MM);

    document.querySelectorAll('.half').forEach(function (half) {
      half.style.width = halfWidthMm + 'mm';
      half.style.height = BOARD_PRINT_MM + 'mm';
    });
    document.querySelectorAll('.half img').forEach(function (img) {
      img.style.width = BOARD_PRINT_MM + 'mm';
      img.style.height = BOARD_PRINT_MM + 'mm';
    });
    document.getElementById('board-img-left').style.left = '0';
    document.getElementById('board-img-right').style.left = rightShiftMm + 'mm';

    // Three evenly-meaningful tick marks per half: an inset near the top,
    // the exact vertical center, and the mirrored inset near the bottom —
    // all derived from BOARD_PRINT_MM so they can't drift from it.
    const TICK_INSET_MM = 40;
    const tickTops = [TICK_INSET_MM, BOARD_PRINT_MM / 2, BOARD_PRINT_MM - TICK_INSET_MM];
    document.querySelectorAll('.half').forEach(function (half) {
      half.querySelectorAll('.tick').forEach(function (tick, i) {
        tick.style.top = tickTops[i] + 'mm';
      });
    });
  </script>
</body>
</html>
