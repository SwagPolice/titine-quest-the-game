<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KALBLAST Card Generator</title>
  <style>
    body {
      background: #121214;
      margin: 0;
      padding: 40px;
      font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
    }

    /* Tarot Card Dimensions & Vibe */
    .card {
      width: 350px;
      height: 600px;
      border-radius: 16px;
      background-size: cover;
      background-position: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7), inset 0 0 0 2px rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      box-sizing: border-box;
    }

    /* Glowing visual background trick */
    .art-bg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 60%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.25;
    }

    /* Frosted Glass Panels */
    .character-name-zone, .textbox {
      background: rgba(20, 16, 28, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      z-index: 2;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    /* 🔒 FIXED: Strictly Block layout, anchored completely to the Left */
    .character-name-zone {
      padding: 12px 16px;
      text-align: left;
      display: block; /* Guarantees items stack vertically, not horizontally */
      position: relative;
    }

    .class-title {
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      text-align: left;
    }

    .class-subtitle {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin: 4px 0 0 0;
      font-weight: 700;
      color: var(--theme-color);
      text-align: left;
    }

    /* Floating Difficulty Badge Style */
    .difficulty-box {
      position: absolute;
      bottom: -14px;
      right: 14px;
      text-align: center;
      background: #14101c;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 4px 8px;
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      z-index: 3;
    }

    .difficulty-label {
      font-size: 8px;
      font-weight: 800;
      color: #a19da8;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 1px;
    }

    .stars {
      color: #fbbf24;
      font-size: 10px;
      letter-spacing: 0.5px;
      line-height: 1;
    }

    .textbox {
      padding: 16px;
    }

    /* Passive Trait Title */
    .section-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
      color: var(--theme-color);
      text-align: left;
    }

    /* Active Ability Flex Container */
    .active-ability-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      width: 100%;
    }

    .active-title-text {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--theme-color);
      text-align: left;
      margin: 0;
    }

    /* 🎨 Splash Circle Badge */
    .cost-badge {
      background: var(--theme-color);
      color: #ffffff;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;

      width: 25px;
      height: 25px;
      border-radius: 50%;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      line-height: 1.1;

      box-shadow: 0 4px 10px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.2);
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);

      flex-shrink: 0;
      margin-left: 12px;
    }

    .rules-text {
      font-size: 12px;
      color: #e2e8f0;
      line-height: 1.5;
      margin: 0 0 14px 0;
      text-align: left;
    }

    .rules-text:last-of-type {
      margin-bottom: 0;
    }

    hr {
      border: 0;
      border-top: 1px solid rgba(255,255,255,0.08);
      margin: 12px 0;
    }

    .flavor-text {
      font-style: italic;
      font-size: 10px;
      color: #64748b;
      text-align: center;
      margin-top: 10px;
    }

    @media print {
      body { background: white; padding: 0; }
      .card { page-break-inside: avoid; }
    }
  </style>
</head>
<body>

  <script>
    // 🗂️ THE CHARACTER DATABASE
    // Add, remove, or modify your character data here!
    const characters = [
      {

        flavor: '"At CAGEC, we cherish our consum... our customers!"'
      },
      {

        flavor: '"I am Glamidir... VOSPODINOV!"'

      {

        flavor: '"Give me your energy, give me your BLOOD!"'
      },
      {
        name: "Turbo Killer",
        title: "EXEC at Imago Pharma",
        image: "berserker.jpg",
        color: "#8327c1",
        difficulty: 2,

        flavor: '"What does not kill you makes you faster!"'
      }
    ];// 🏗️ CARD GENERATOR ENGINE
    const body = document.body;

    characters.forEach(char => {
      const starIcons = "★".repeat(char.difficulty);

      const card = document.createElement('div');
      card.className = 'card';
      card.style.backgroundImage = `url('${char.image}')`;
      card.style.setProperty('--theme-color', char.color);

      card.innerHTML = `
        <div class="art-bg" style="background: radial-gradient(circle at center, ${char.color} 0%, rgba(0,0,0,0) 70%);"></div>

        <div class="character-name-zone">
          <h1 class="class-title">${char.name}</h1>
          <p class="class-subtitle">${char.title}</p>

          <div class="difficulty-box">
            <div class="difficulty-label">Difficulty</div>
            <div class="stars">${starIcons}</div>
          </div>
        </div>

        <div class="textbox">
          <div class="section-title">⚙️ ${char.traitName}</div>
          <p class="rules-text">${char.traitDesc}</p>

          <hr>

          <div class="active-ability-row">
            <h2 class="active-title-text">⚡ ${char.abilityName}</h2>
            <span class="cost-badge">${char.abilityCost}</span>
          </div>

          <p class="rules-text">${char.abilityDesc}</p>

          <div class="flavor-text">${char.flavor}</div>
        </div>
      `;

      body.appendChild(card);
    });
  </script>
</body>
</html>
